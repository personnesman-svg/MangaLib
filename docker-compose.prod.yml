services:
  nginx:
    ports: []
  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your real domain in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [nginx]
    networks: [app]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
